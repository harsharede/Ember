name: Release

# Push a tag like v1.1.0 and this builds the release APK, signs it with the private key kept in the repository's
# secrets, and publishes it as a GitHub Release (where Obtainium and IzzyOnDroid can pick it up).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the EMBER_KEYSTORE_BASE64 secret first (see RELEASING.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ember.jks"
          echo "EMBER_KEYSTORE=$RUNNER_TEMP/ember.jks" >> "$GITHUB_ENV"
      - name: Test and build the release APK
        env:
          EMBER_KEYSTORE_PASSWORD: ${{ secrets.EMBER_KEYSTORE_PASSWORD }}
          EMBER_KEY_ALIAS: ${{ secrets.EMBER_KEY_ALIAS }}
          EMBER_KEY_PASSWORD: ${{ secrets.EMBER_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest :app:assembleRelease
      - name: Name the APK after the version
        run: cp app/build/outputs/apk/release/app-release.apk "ember-${GITHUB_REF_NAME}.apk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ember-${GITHUB_REF_NAME}.apk" --title "Ember $GITHUB_REF_NAME" --generate-notes
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/ember.jks"
